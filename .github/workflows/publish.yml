name: Publish

# Publishes to npm when a version tag (like v4.0.0 or v4.0.0-beta.1) is pushed.
# See "Publishing" in CONTRIBUTING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Corepack provides the Yarn version pinned in package.json
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  # Installs, tests and packs without any permission to publish, so dependency
  # install scripts never run where they could get a publishing token.
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}
      prerelease: ${{ steps.dist-tag.outputs.prerelease }}

    steps:
    - uses: actions/checkout@v7
      with:
        # So we can check that the tag is on main
        fetch-depth: 0
        persist-credentials: false

    - name: Check the tag is on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$GITHUB_REF_NAME is not on main. Only tag commits that are on main."
          exit 1
        fi

    - name: Check the tag matches package.json
      run: |
        PACKAGE_VERSION="v$(node -p 'require("./package.json").version')"
        if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION."
          exit 1
        fi

    - name: Pick the npm dist-tag
      id: dist-tag
      run: |
        # v4.0.0 -> latest, v4.0.0-beta.1 -> beta, v4.0.0-1 -> next
        PRERELEASE="${GITHUB_REF_NAME#*-}"
        if [ "$PRERELEASE" = "$GITHUB_REF_NAME" ]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        else
          LABEL=$(echo "$PRERELEASE" | grep -oE '^[A-Za-z]+' || true)
          echo "tag=${LABEL:-next}" >> "$GITHUB_OUTPUT"
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        fi

    - run: corepack enable
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        # Don't restore a cache in a release
        package-manager-cache: false

    - run: yarn install --immutable
    - run: yarn lint:quiet
    # Also builds dist/ and types/
    - run: yarn test

    - name: Pack
      run: |
        mkdir release
        npm pack --pack-destination release

        # Use this version's CHANGELOG section as the release notes, if there is one
        awk -v header="## [$GITHUB_REF_NAME]" '
          index($0, header) == 1 { found = 1; next }
          /^## \[/ { if (found) exit }
          found
        ' CHANGELOG.md > release/release-notes.md

    - uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/
        if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    # Not Blacksmith: npm trusted publishing only accepts OIDC tokens from GitHub-hosted
    # runners (https://docs.npmjs.com/trusted-publishers). On a self-hosted runner npm
    # silently falls back to token auth and the publish fails with a 404.
    runs-on: ubuntu-latest
    permissions:
      # To create the GitHub release
      contents: write
      # For npm trusted publishing (OIDC). No npm token needed.
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        # Trusted publishing needs npm 11.5.1+, which Node 24 comes with
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Check npm supports trusted publishing
      run: |
        NPM_VERSION=$(npm --version)
        if ! node -e '
          const [major, minor, patch] = process.argv[1].split(".").map(Number)
          process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)
        ' "$NPM_VERSION"; then
          echo "::error::npm $NPM_VERSION is too old for trusted publishing. It needs 11.5.1 or later."
          exit 1
        fi

    - name: Publish
      # npm adds provenance automatically when publishing with trusted publishing
      run: npm publish ./*.tgz --access public --tag "${{ needs.build.outputs.dist-tag }}"

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      run: |
        if [ -s release-notes.md ]; then
          NOTES=(--notes-file release-notes.md)
        else
          NOTES=(--generate-notes)
        fi

        if [ "$PRERELEASE" = "true" ]; then
          LATEST=(--prerelease)
        else
          LATEST=(--latest)
        fi

        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
          --title "$GITHUB_REF_NAME" "${NOTES[@]}" "${LATEST[@]}"
